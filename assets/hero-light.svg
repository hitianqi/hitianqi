<svg xmlns="http://www.w3.org/2000/svg" width="880" height="280" viewBox="0 0 880 280" role="img" aria-label="Tianqi Zhao, AI engineer at Prover">
<style>
  .sans { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; }
  .num { font-variant-numeric: tabular-nums; }
  .in { opacity: 0; animation: in .5s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .in { animation: none; opacity: 1; } }
</style>
<defs>
  <radialGradient id="wa"><stop offset="0" stop-color="#8b7bff" stop-opacity=".5"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
  <radialGradient id="wb"><stop offset="0" stop-color="#ffb08a" stop-opacity=".5"/><stop offset="1" stop-color="#ffb08a" stop-opacity="0"/></radialGradient>
  <clipPath id="panel"><rect width="880" height="280" rx="20"/></clipPath>
  <clipPath id="type"><rect x="510" y="206" height="20" width="0">
    <animate attributeName="width" values="0.0;7.2;14.4;21.7;28.9;36.1;43.3;50.5;57.8;65.0;72.2;79.4;86.6;93.9;101.1;108.3;115.5;122.7;130.0;137.2" dur=".9s" begin="1.1s" calcMode="discrete" fill="freeze"/>
  </rect></clipPath>
</defs>
<g clip-path="url(#panel)">
  <rect width="880" height="280" fill="#f6f6f7"/>
  <circle cx="650" cy="250" r="280" fill="url(#wa)"/>
  <circle cx="850" cy="40" r="230" fill="url(#wb)"/>
</g>
<rect x=".5" y=".5" width="879" height="279" rx="19.5" fill="none" stroke="rgba(0,0,0,.06)"/>

<g class="in">
  <text x="48" y="76" class="mono" font-size="11" letter-spacing="1.4" fill="#a3a3ab">STOCKHOLM, SWEDEN</text>
  <text x="45" y="138" class="sans" font-size="54" font-weight="500" letter-spacing="-2.2" fill="#0b0b0d">Tianqi Zhao</text>
</g>
<g class="in" style="animation-delay:.12s">
  <text x="48" y="180" class="sans" font-size="20" letter-spacing="-.3" fill="#0b0b0d">AI engineer at Prover.</text>
  <text x="48" y="208" class="sans" font-size="20" letter-spacing="-.3" fill="#6b6b74">Building tools for coding agents</text>
  <text x="48" y="234" class="sans" font-size="20" letter-spacing="-.3" fill="#6b6b74">you can actually watch.</text>
</g>

<g class="in" style="animation-delay:.2s">
  <rect x="492" y="40" width="348" height="200" rx="12" fill="#ffffff"/>
  <rect x="492.5" y="40.5" width="347" height="199" rx="11.5" fill="none" stroke="rgba(0,0,0,.06)"/>
  <circle cx="510" cy="57" r="4.5" fill="#e6e6e9"/>
  <circle cx="525" cy="57" r="4.5" fill="#e6e6e9"/>
  <circle cx="540" cy="57" r="4.5" fill="#e6e6e9"/>
  <text x="666.0" y="61" text-anchor="middle" class="mono" font-size="11" fill="#a3a3ab">agents · 3 roles</text>
  <line x1="492" x2="840" y1="74.5" y2="74.5" stroke="rgba(0,0,0,.06)"/>
  <line x1="510" x2="822" y1="193.5" y2="193.5" stroke="rgba(0,0,0,.06)"/>
</g>
<g class="in" style="animation-delay:0.35s"><circle cx="514" cy="104" r="4" fill="#22c55e"/><text x="528" y="108" class="mono" font-size="12" fill="#0b0b0d">planner</text><text x="610" y="108" class="mono" font-size="12" fill="#6b6b74">plan approved, 4 steps</text></g><g class="in" style="animation-delay:0.47s"><circle cx="514" cy="134" r="4" fill="#3b82f6"/><text x="528" y="138" class="mono" font-size="12" fill="#0b0b0d">builder</text><text x="610" y="138" class="mono" font-size="12" fill="#6b6b74">editing panel.ts</text></g><g class="in" style="animation-delay:0.59s"><circle cx="514" cy="164" r="4" fill="#f59e0b"/><text x="528" y="168" class="mono" font-size="12" fill="#0b0b0d">reviewer</text><text x="610" y="168" class="mono" font-size="12" fill="#6b6b74">waiting for you</text></g>
<g clip-path="url(#type)">
  <text x="510" y="220" class="mono" font-size="12" fill="#22c55e">✓ <tspan fill="#6b6b74">3 branches merged</tspan></text>
</g>
</svg>
